name: Verify commerce platform
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: commerce-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMMERCE_EVIDENCE_DIR: ../docs/evidence/s10b
      COMMERCE_UI_URL: http://127.0.0.1:8600
      COMMERCE_E2E_BASE_URL: http://127.0.0.1:8600
      COMMERCE_BASE_URL: http://127.0.0.1:8600
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create isolated CI resources
        run: python3 scripts/ci-configure.py
      - name: Build and verify real MySQL semantics
        run: scripts/build.sh 2>&1 | tee docs/evidence/s10b/ci-build.log
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high
      - name: Start packaged application
        shell: bash
        run: |
          source .local/runtime.env
          java -jar commerce-app/target/commerce-app-0.1.0-SNAPSHOT.jar > .local/ci-app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8600/actuator/health > /dev/null; then break; fi
            sleep 1
          done
          python3 deploy/smoke.py
      - name: Browser fixtures and Chromium
        run: |
          python3 scripts/prepare-e2e.py
          cd frontend
          npx playwright install --with-deps chromium
      - name: Real browser commerce acceptance
        run: npm run e2e --prefix frontend 2>&1 | tee docs/evidence/s10b/ci-browser.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commerce-verification
          retention-days: 7
          path: |
            docs/evidence/s10b/ci-*.log
            docs/evidence/s10b/browser-results.json
            docs/evidence/s10b/*.png
            **/target/surefire-reports/*.xml
      - name: Stop only the ephemeral CI database
        if: always()
        run: |
          if [[ -n "${COMMERCE_MYSQL_CONTAINER:-}" && "$COMMERCE_MYSQL_CONTAINER" == commerce-ci-mysql-* ]]; then
            docker rm -f "$COMMERCE_MYSQL_CONTAINER"
          fi
